<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbeeee">
  <title>For You ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Nunito+Sans:wght@300;400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
:root {
  --blush: #fdf3f2;
  --petal: #f4d5dc;
  --rose: #c8647f;
  --wine: #5a2a3c;
  --ink: #3b2230;
  --lilac: #e6dcf0;
  --gold: #c9a36b;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Nunito Sans", system-ui, -apple-system, sans-serif;
  --script: "Pinyon Script", "Snell Roundhand", cursive;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--sans);
  font-weight: 300;
  color: var(--ink);
  line-height: 1.7;
  background: linear-gradient(180deg, #fdf3f2 0%, #f8e8ee 45%, #efe6f5 100%) fixed;
  overflow-x: hidden;
}

#hearts {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

main, .hero, .footer { position: relative; z-index: 1; }

h2 {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(2rem, 6vw, 3.2rem);
  line-height: 1.15;
  color: var(--wine);
  text-align: center;
  margin: 0 0 2.5rem;
}

/* ---------- Opening ---------- */
.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));
}
.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  z-index: -1;
}
.hero::before { width: 60vmax; height: 60vmax; background: var(--petal); opacity: .7; top: -15vmax; left: -20vmax; }
.hero::after  { width: 50vmax; height: 50vmax; background: var(--lilac); opacity: .8; bottom: -15vmax; right: -15vmax; }

.hero-kicker {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.15rem, 3.6vw, 1.7rem);
  color: var(--rose);
  margin: 0 0 .5rem;
  opacity: 0;
  animation: fadeIn 1.4s .2s forwards;
}
.hero-name {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(4rem, 19vw, 11rem);
  line-height: 1.1;
  margin: 0;
  color: var(--wine);
  padding: 0 .1em .15em;
}
.hero-name .ch {
  display: inline-block;
  opacity: 0;
  filter: blur(12px);
  transform: translateY(.18em) scale(.96);
  animation: inkIn 1.2s cubic-bezier(.2, .7, .2, 1) forwards;
}
.hero-name .sp { display: inline-block; width: .3em; }

.hero-scroll {
  position: absolute;
  bottom: calc(1.5rem + env(safe-area-inset-bottom));
  left: 50%;
  width: 26px;
  height: 44px;
  margin-left: -13px;
  border: 1.5px solid var(--rose);
  border-radius: 14px;
  opacity: 0;
  animation: fadeIn 1s 3s forwards;
}
.hero-scroll span {
  position: absolute;
  top: 8px; left: 50%;
  width: 4px; height: 8px;
  margin-left: -2px;
  border-radius: 2px;
  background: var(--rose);
  animation: scrollDot 1.8s infinite;
}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes inkIn { to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes scrollDot { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }

/* ---------- Sections ---------- */
.section {
  padding: clamp(4rem, 12vw, 8rem) 1.5rem;
  max-width: 1100px;
  margin: 0 auto;
}

.reveal { opacity: 0; transform: translateY(16px); transition: opacity 1s ease, transform 1s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ---------- Message ---------- */
.letter { max-width: 640px; }
.letter-body p {
  font-family: var(--serif);
  font-size: clamp(1.3rem, 4.2vw, 1.65rem);
  line-height: 1.6;
  margin: 0 0 1.4rem;
  text-align: center;
}
.letter-body p:first-child::first-letter {
  font-family: var(--script);
  font-size: 1.9em;
  color: var(--rose);
  line-height: 0;
  padding-right: .04em;
}
.signature {
  font-family: var(--script);
  font-size: clamp(2rem, 7vw, 2.8rem);
  color: var(--rose);
  text-align: center;
  margin: 2rem 0 0;
}

/* ---------- Gallery: arch frames ---------- */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.25rem;
  align-items: start;
}
.frame {
  margin: 0;
  cursor: zoom-in;
  background: none;
  border: 0;
  padding: 0;
  text-align: center;
  font: inherit;
  color: inherit;
}
.frame .arch {
  display: block;
  aspect-ratio: 3 / 4;
  border-radius: 999px 999px 14px 14px;
  overflow: hidden;
  border: 6px solid #fff;
  box-shadow: 0 14px 34px rgba(150, 70, 100, .16);
  background: linear-gradient(160deg, var(--petal), var(--lilac));
  position: relative;
  transition: transform .6s cubic-bezier(.2, .7, .2, 1), box-shadow .6s;
}
.frame:nth-child(even) { margin-top: 2.5rem; }
.frame:nth-child(3n) .arch { aspect-ratio: 4 / 5; }
.frame:hover .arch, .frame:focus-visible .arch { transform: translateY(-6px); box-shadow: 0 22px 44px rgba(150, 70, 100, .24); }
.frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.gallery.single { grid-template-columns: minmax(0, 400px); justify-content: center; }
.gallery.single .frame, .gallery.single .frame:nth-child(n) { margin-top: 0; }
.gallery.single .frame .arch { aspect-ratio: 4 / 5; }
.frame .ph {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 2.4rem; color: var(--rose);
}
.frame figcaption, .frame .cap {
  display: block;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.15rem;
  color: var(--wine);
  margin-top: .8rem;
}

/* ---------- Timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 14px;
  width: 1.5px;
  background: linear-gradient(var(--petal), var(--rose), var(--petal));
}
.moment { position: relative; padding: 0 0 2.6rem 3rem; }
.moment::before {
  content: "❤";
  position: absolute;
  left: 4px; top: .1rem;
  font-size: 1.1rem;
  line-height: 1;
  color: var(--rose);
  background: var(--blush);
  padding: 2px 0;
}
.moment .date { font-size: .9rem; color: var(--gold); font-weight: 600; letter-spacing: .04em; margin: 0; }
.moment h3 { font-family: var(--serif); font-size: 1.7rem; font-weight: 500; color: var(--wine); margin: .1rem 0 .3rem; line-height: 1.2; }
.moment p:last-child { margin: 0; max-width: 46ch; }

/* ---------- Surprise ---------- */
.surprise { text-align: center; max-width: 640px; padding-top: 2rem; }
.surprise-btn {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.45rem;
  color: #fff;
  background: linear-gradient(135deg, #d9778f, #b8546f);
  border: 0;
  border-radius: 999px;
  padding: 1rem 2.4rem;
  cursor: pointer;
  box-shadow: 0 10px 28px rgba(200, 100, 127, .4);
  transition: transform .3s, box-shadow .3s;
  animation: beat 2.6s ease-in-out infinite;
}
.surprise-btn:hover { transform: scale(1.05); box-shadow: 0 14px 34px rgba(200, 100, 127, .5); }
.surprise-btn:active { transform: scale(.97); }
.surprise-btn.done { animation: none; background: #fff; color: var(--rose); box-shadow: 0 6px 20px rgba(150, 70, 100, .15); }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

.surprise-card {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 1s cubic-bezier(.2, .7, .2, 1);
}
.surprise-card.open { grid-template-rows: 1fr; }
.surprise-inner { overflow: hidden; }
.surprise-inner p {
  font-family: var(--serif);
  font-size: clamp(1.4rem, 4.6vw, 1.9rem);
  font-style: italic;
  line-height: 1.55;
  color: var(--wine);
  margin: 2.2rem 0 0;
  opacity: 0;
  transition: opacity 1.4s .5s;
}
.surprise-card.open .surprise-inner p { opacity: 1; }

.footer { text-align: center; padding: 2rem 1.5rem calc(3rem + env(safe-area-inset-bottom)); font-family: var(--serif); font-style: italic; color: var(--rose); }
.footer p { margin: 0; }

/* ---------- Lightbox ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(59, 34, 48, .88);
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  animation: fadeIn .3s forwards; opacity: 0;
}
.lightbox[hidden] { display: none; }
.lightbox figure { margin: 0; max-width: 560px; text-align: center; }
.lightbox img { max-width: 100%; max-height: 78svh; border-radius: 12px; border: 6px solid #fff; }
.lightbox figcaption { color: #fff; font-family: var(--serif); font-style: italic; font-size: 1.3rem; margin-top: .8rem; }
.lightbox-close {
  position: absolute; top: calc(.8rem + env(safe-area-inset-top)); right: 1rem;
  font-size: 2.4rem; line-height: 1; color: #fff; background: none; border: 0; cursor: pointer; padding: .3rem .6rem;
}

:focus-visible { outline: 2px solid var(--rose); outline-offset: 4px; }

/* ---------- Larger screens ---------- */
@media (min-width: 760px) {
  .gallery { grid-template-columns: repeat(3, 1fr); gap: 2rem; }
  .frame:nth-child(even) { margin-top: 0; }
  .frame:nth-child(3n + 2) { margin-top: 3rem; }

  .timeline::before { left: 50%; margin-left: -.75px; }
  .moment { width: 50%; padding: 0 3rem 3rem 0; text-align: right; }
  .moment::before { left: auto; right: -9px; }
  .moment p:last-child { margin-left: auto; }
  .moment:nth-child(even) { margin-left: 50%; padding: 0 0 3rem 3rem; text-align: left; }
  .moment:nth-child(even)::before { right: auto; left: -9px; }
  .moment:nth-child(even) p:last-child { margin-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .reveal { opacity: 1; transform: none; }
}

</style>
</head>
<body>
  <canvas id="hearts" aria-hidden="true"></canvas>

  <!-- Opening -->
  <header class="hero" id="top">
    <p class="hero-kicker" id="tagline"></p>
    <h1 class="hero-name" id="name" aria-label=""></h1>
    <a class="hero-scroll" href="#message" aria-label="Scroll down"><span></span></a>
  </header>

  <main>
    <!-- Heartfelt message -->
    <section class="section letter" id="message">
      <h2 class="reveal" id="messageTitle"></h2>
      <div class="letter-body reveal" id="messageBody"></div>
      <p class="signature reveal" id="signature"></p>
    </section>

    <!-- Photo gallery -->
    <section class="section" id="gallery">
      <h2 class="reveal" id="galleryTitle"></h2>
      <div class="gallery" id="galleryGrid"></div>
    </section>

    <!-- Memories timeline -->
    <section class="section" id="memories">
      <h2 class="reveal" id="memoriesTitle"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <!-- Surprise -->
    <section class="section surprise" id="surprise">
      <button class="surprise-btn" id="surpriseBtn" aria-expanded="false" aria-controls="surpriseCard"></button>
      <div class="surprise-card" id="surpriseCard" role="region" aria-live="polite">
        <div class="surprise-inner">
          <p id="surpriseText"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"><p id="footerText"></p></footer>

  <!-- Photo viewer -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close photo">&times;</button>
    <figure>
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCap"></figcaption>
    </figure>
  </div>

/* =====================================================
   Everything below builds the page. No need to edit.
   ===================================================== */
const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

document.title = `For ${CONFIG.name} ❤️`;

/* Opening: name appears letter by letter, like ink */
$("tagline").textContent = CONFIG.tagline;
const nameEl = $("name");
nameEl.setAttribute("aria-label", CONFIG.name);
[...CONFIG.name].forEach((ch, i) => {
  const span = document.createElement("span");
  span.setAttribute("aria-hidden", "true");
  if (ch === " ") span.className = "sp";
  else { span.className = "ch"; span.textContent = ch; }
  span.style.animationDelay = `${0.7 + i * 0.12}s`;
  nameEl.appendChild(span);
});

/* Message */
$("messageTitle").textContent = CONFIG.messageTitle;
CONFIG.message.forEach((text) => {
  const p = document.createElement("p");
  p.textContent = text;
  $("messageBody").appendChild(p);
});
$("signature").textContent = CONFIG.signature;

/* Gallery */
$("galleryTitle").textContent = CONFIG.galleryTitle;
if (CONFIG.photos.length === 1) $("galleryGrid").classList.add("single");
CONFIG.photos.forEach((photo) => {
  const frame = document.createElement("button");
  frame.type = "button";
  frame.className = "frame reveal";
  frame.setAttribute("aria-label", `Open photo: ${photo.caption}`);

  const arch = document.createElement("span");
  arch.className = "arch";

  const img = new Image();
  img.src = photo.src;
  img.alt = photo.caption;
  img.loading = "lazy";
  img.onerror = () => {
    img.remove();
    const ph = document.createElement("span");
    ph.className = "ph";
    ph.textContent = "❤";
    arch.appendChild(ph);
    frame.dataset.missing = "true";
  };
  arch.appendChild(img);

  const cap = document.createElement("span");
  cap.className = "cap";
  cap.textContent = photo.caption;

  frame.append(arch, cap);
  frame.addEventListener("click", () => {
    if (frame.dataset.missing) return;
    $("lightboxImg").src = photo.src;
    $("lightboxImg").alt = photo.caption;
    $("lightboxCap").textContent = photo.caption;
    $("lightbox").hidden = false;
    $("lightboxClose").focus();
  });
  $("galleryGrid").appendChild(frame);
});

const closeLightbox = () => { $("lightbox").hidden = true; };
$("lightboxClose").addEventListener("click", closeLightbox);
$("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) closeLightbox(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

/* Memories */
if (!CONFIG.memories.length) $("memories").hidden = true;
$("memoriesTitle").textContent = CONFIG.memoriesTitle;
CONFIG.memories.forEach((m) => {
  const li = document.createElement("li");
  li.className = "moment reveal";
  li.innerHTML = `<p class="date"></p><h3></h3><p></p>`;
  li.querySelector(".date").textContent = m.date;
  li.querySelector("h3").textContent = m.title;
  li.querySelector("p:last-child").textContent = m.text;
  $("timeline").appendChild(li);
});

/* Footer */
$("footerText").textContent = `${CONFIG.footer} ❤`;

/* Gentle reveal on scroll */
const io = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
  });
}, { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach((el, i) => {
  el.style.transitionDelay = `${(i % 3) * 0.1}s`;
  io.observe(el);
});

/* Floating hearts */
const canvas = $("hearts");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, hearts = [], bursts = [];
const COLORS = ["#f4b6c6", "#e8a0b5", "#d98aa0", "#e6dcf0", "#f7d9b5"];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function makeHeart(fromBottom = false) {
  return {
    x: Math.random() * W,
    y: fromBottom ? H + 20 : Math.random() * H,
    size: 6 + Math.random() * 12,
    speed: 0.15 + Math.random() * 0.35,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.004 + Math.random() * 0.01,
    alpha: 0.15 + Math.random() * 0.3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function drawHeart(x, y, s, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y - s * 0.3, x - s, y - s * 0.3, x - s, y + s * 0.3);
  ctx.bezierCurveTo(x - s, y + s * 0.8, x, y + s * 1.1, x, y + s * 1.4);
  ctx.bezierCurveTo(x, y + s * 1.1, x + s, y + s * 0.8, x + s, y + s * 0.3);
  ctx.bezierCurveTo(x + s, y - s * 0.3, x, y - s * 0.3, x, y + s * 0.3);
  ctx.fill();
  ctx.restore();
}

function frame() {
  ctx.clearRect(0, 0, W, H);
  hearts.forEach((h, i) => {
    h.y -= h.speed;
    h.sway += h.swaySpeed;
    drawHeart(h.x + Math.sin(h.sway) * 18, h.y, h.size, h.color, h.alpha);
    if (h.y < -30) hearts[i] = makeHeart(true);
  });
  bursts = bursts.filter((b) => b.life > 0);
  bursts.forEach((b) => {
    b.x += b.vx; b.y += b.vy; b.vy += 0.03; b.life -= 0.012;
    drawHeart(b.x, b.y, b.size, b.color, Math.max(b.life, 0));
  });
  requestAnimationFrame(frame);
}

function burstHearts(x, y) {
  if (reduceMotion) return;
  for (let i = 0; i < 28; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 1 + Math.random() * 3.5;
    bursts.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
      size: 5 + Math.random() * 9, life: 1,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  }
}

resize();
window.addEventListener("resize", resize);
const count = Math.round(Math.min(26, Math.max(12, W / 50)));
hearts = Array.from({ length: count }, () => makeHeart());
if (reduceMotion) { ctx.clearRect(0, 0, W, H); hearts.forEach((h) => drawHeart(h.x, h.y, h.size, h.color, h.alpha)); }
else requestAnimationFrame(frame);

/* Surprise button */
const btn = $("surpriseBtn");
btn.textContent = CONFIG.surpriseButton;
$("surpriseText").textContent = CONFIG.surpriseMessage;
btn.addEventListener("click", () => {
  const card = $("surpriseCard");
  const open = card.classList.toggle("open");
  btn.setAttribute("aria-expanded", String(open));
  btn.classList.toggle("done", open);
  if (open) {
    const r = btn.getBoundingClientRect();
    burstHearts(r.left + r.width / 2, r.top + r.height / 2);
    setTimeout(() => card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }), 350);
  }
});

</script>
</body>
</html>
